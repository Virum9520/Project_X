# Alembic config for the Skill Garden database. Run from the repo root:
#   uv run alembic upgrade head
# The database URL comes from sg_core.settings (DATABASE_URL), never from this file.
[alembic]
script_location = %(here)s/services/core/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

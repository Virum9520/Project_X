name: CI

# One check per push: the Python and web quality gates from CLAUDE.md. The database migration
# round trip and the Railway image builds run on demand in "Extended checks" (ci-extended.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile

      - name: Python lint and format
        run: |
          uv run ruff check services
          uv run ruff format --check services
      - name: Python types
        run: uv run mypy services/core/src services/api/src services/worker/src services/mcp_gateway/src services/agentops/src
      - name: Python tests
        run: uv run pytest -q
        env:
          ENVIRONMENT: test

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

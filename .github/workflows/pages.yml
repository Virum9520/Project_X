name: Deploy to GitHub Pages

# Publishes a login-free build of the web app to https://<owner>.github.io/<repo>/. There is no
# server there: the coaches, the code runner (JavaScript, TypeScript and Python via Pyodide) and
# the garden run in the browser, on content exported from the API's own modules. One job, so one
# check per push. One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "curriculum/**"
      - "services/api/src/sg_api/arjuna/**"
      - "services/api/src/sg_api/drona/**"
      - "services/api/src/sg_api/vidura/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_DEMO: "1"
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Export practice content (questions, problem bank and tests, résumé lexicon)
        run: uv run --no-project --with pyyaml python apps/web/scripts/export-practice-data.py
      - name: Swap in the browser-only pages (CI checkout only)
        run: node apps/web/scripts/prepare-pages.mjs
      - run: pnpm --filter ./apps/web build
      - name: Add .nojekyll and a 404 page
        run: |
          touch apps/web/out/.nojekyll
          test -f apps/web/out/404.html || cp apps/web/out/index.html apps/web/out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4

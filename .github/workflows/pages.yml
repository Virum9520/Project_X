name: Deploy static demo to GitHub Pages

# Publishes a login-free, sample-data build of the web app (landing, Home, My garden, Past sessions,
# Coaches) to https://<owner>.github.io/<repo>/. The real app (Clerk, API, voice) is not on Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_DEMO: "1"
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strip server-only routes (CI checkout only)
        run: node apps/web/scripts/prepare-pages.mjs
      - run: pnpm --filter ./apps/web build
      - name: Add .nojekyll and a 404 page
        run: |
          touch apps/web/out/.nojekyll
          test -f apps/web/out/404.html || cp apps/web/out/index.html apps/web/out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: show_question_card
type: client
description: >-
  Show the current question on the learner's screen so they can read it while answering. Call it
  whenever you ask a question from fetch_question.
timeout_secs: 5
parameters:
  required: [question_id, title, body]
  properties:
    question_id:
      type: string
      description: The question ID from fetch_question.
    title:
      type: string
      description: Short title, under 8 words.
    body:
      type: string
      description: The question text as the learner should read it. Plain text, under 80 words.

type: llm
description: Vidura asks for the missing part of a vague story instead of lecturing about STAR.
chat_history:
  - role: agent
    message: Tell me about a time you worked in a team toward a shared goal. What was your part?
  - role: user
    message: >-
      We had a hackathon last spring and our team built a budgeting app. It was a lot of work but
      we all pulled together and in the end it went well.
success_condition: >-
  The agent asks one short follow-up that targets a missing element of the story, such as what the
  candidate personally did or what the concrete result was, without explaining the STAR method
  or commenting on the candidate's personality.
failure_examples:
  - Great answer! You nailed the STAR method and clearly are a natural leader.

[project]
name = "sg_worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sg_core",
  "hatchet-sdk>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_worker"]

[tool.uv.sources]
sg_core = { workspace = true }

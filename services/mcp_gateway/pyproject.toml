[project]
name = "sg_mcp_gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sg_core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_mcp_gateway"]

[tool.uv.sources]
sg_core = { workspace = true }

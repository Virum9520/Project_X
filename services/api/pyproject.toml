[project]
name = "sg_api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sg_core",
  "sg_worker",
  "sg_mcp_gateway",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "alembic>=1.14",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_api"]

[tool.uv.sources]
sg_core = { workspace = true }
sg_worker = { workspace = true }
sg_mcp_gateway = { workspace = true }

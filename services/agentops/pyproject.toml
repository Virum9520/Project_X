[project]
name = "sg_agentops"
version = "0.1.0"
description = "ElevenLabs agents-as-code tooling: compile agent sources, design voices, sync with the elevenlabs CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sg_core",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
sg-agents = "sg_agentops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_agentops"]

[tool.uv.sources]
sg_core = { workspace = true }

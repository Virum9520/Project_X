[project]
name = "sg_core"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "structlog>=24.4",
  "httpx>=0.27",
  "alembic>=1.14",
  "pgvector>=0.3",
  "pyjwt[crypto]>=2.9",
  "redis>=5.2",
  "pyyaml>=6.0",
  "boto3>=1.43.108",
  "e2b>=2.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_core"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.108",
]
